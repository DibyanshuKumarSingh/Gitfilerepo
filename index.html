```html
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SkyWeather</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <main class="sky" id="sky">

    <!-- ================= SUN ================= -->
    <div class="sun" id="sun">
      <div class="sun-core"></div>
    </div>


    <!-- ================= CLOUDS ================= -->

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

  <div class="logo">
    SKY<span>°</span>
  </div>

  <div class="nav-links">

    <a href="./master.html">
      Home
    </a>

    <a href="./weather.html">
      Weather
    </a>

    <a href="./forecast.html">
      Forecast
    </a>

  </div>

  <div class="live-status">
    <span></span>
    LIVE
  </div>

</nav>

    <!-- ================= MAIN ================= -->

    <section class="hero">

      <div class="location">
        <span>📍</span>
        <span id="location">Loading location...</span>
      </div>


      <div class="time-box">

        <div id="currentTime">
          --:--:--
        </div>

        <small id="currentDate">
          Loading date...
        </small>

      </div>


      <div class="weather-main">

        <div class="weather-icon" id="weatherIcon">
          ☀️
        </div>

        <div class="temperature">

          <span id="temperature">
            --
          </span>

          <sup>°C</sup>

        </div>

        <div class="weather-description" id="weatherDescription">
          Loading weather...
        </div>

      </div>


      <!-- ================= WEATHER CARDS ================= -->

      <div class="weather-grid">

        <div class="weather-card">

          <div class="card-icon">
            💧
          </div>

          <div>
            <small>Humidity</small>

            <strong id="humidity">
              --%
            </strong>
          </div>

        </div>


        <div class="weather-card">

          <div class="card-icon">
            💨
          </div>

          <div>
            <small>Wind</small>

            <strong id="wind">
              -- km/h
            </strong>
          </div>

        </div>


        <div class="weather-card">

          <div class="card-icon">
            🌡️
          </div>

          <div>
            <small>Feels Like</small>

            <strong id="feelsLike">
              --°C
            </strong>
          </div>

        </div>


        <div class="weather-card">

          <div class="card-icon">
            🌧️
          </div>

          <div>
            <small>Rain Chance</small>

            <strong id="rainChance">
              --%
            </strong>
          </div>

        </div>

      </div>


      <!-- ================= SUN INFO ================= -->

      <div class="sun-info">

        <div>
          🌅
          <span>Sunrise</span>
          <strong id="sunrise">
            --:--
          </strong>
        </div>

        <div class="sun-line">

          <div class="sun-progress">

            <div
              class="sun-progress-fill"
              id="sunProgress">
            </div>

            <div
              class="sun-marker"
              id="sunMarker">
            </div>

          </div>

          <div class="east-west">
            <span>East</span>
            <span>West</span>
          </div>

        </div>

        <div>
          🌇
          <span>Sunset</span>
          <strong id="sunset">
            --:--
          </strong>
        </div>

      </div>

    </section>


    <!-- ================= HORIZON ================= -->

    <div class="horizon"></div>


    <!-- ================= EAST / WEST ================= -->

    <div class="direction east">
      EAST
      <small>SUNRISE</small>
    </div>

    <div class="direction west">
      WEST
      <small>SUNSET</small>
    </div>


  </main>


  <script src="./js/weather.js"></script>

</body>

</html>
```
